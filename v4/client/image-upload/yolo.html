<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>YOLOv11 Browser Detection (ONNX)</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 24px; }
    .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    #preview { max-width: 520px; border: 1px solid #ddd; border-radius: 8px; }
    .hint { color: #555; line-height: 1.4; }
  </style>

  <!-- ONNX Runtime Web (WASM) -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
</head>
<body>
  <h2>YOLOv11n ONNX – Object Detection in Browser</h2>

  <div class="row">
    <input id="fileInput" type="file" accept="image/*" />
    <button id="runBtn" disabled>Run recognize()</button>
  </div>

  <p class="hint">
    Model path expected: <code>yolo11n.onnx</code><br/>
    Results are logged in the DevTools console.
  </p>

  <img id="preview" alt="preview" />

  <script>
    // -------- COCO 80 classes (YOLOv11n pretrained on COCO) --------
    const COCO_CLASSES = [
      "person","bicycle","car","motorcycle","airplane","bus","train","truck","boat","traffic light",
      "fire hydrant","stop sign","parking meter","bench","bird","cat","dog","horse","sheep","cow",
      "elephant","bear","zebra","giraffe","backpack","umbrella","handbag","tie","suitcase","frisbee",
      "skis","snowboard","sports ball","kite","baseball bat","baseball glove","skateboard","surfboard","tennis racket","bottle",
      "wine glass","cup","fork","knife","spoon","bowl","banana","apple","sandwich","orange",
      "broccoli","carrot","hot dog","pizza","donut","cake","chair","couch","potted plant","bed",
      "dining table","toilet","tv","laptop","mouse","remote","keyboard","cell phone","microwave","oven",
      "toaster","sink","refrigerator","book","clock","vase","scissors","teddy bear","hair drier","toothbrush"
    ];

    // -------- Utilities --------
    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
    const sigmoid = (x) => 1 / (1 + Math.exp(-x));

    function iou(a, b) {
      const ax2 = a.x + a.w, ay2 = a.y + a.h;
      const bx2 = b.x + b.w, by2 = b.y + b.h;

      const interX1 = Math.max(a.x, b.x);
      const interY1 = Math.max(a.y, b.y);
      const interX2 = Math.min(ax2, bx2);
      const interY2 = Math.min(ay2, by2);

      const iw = Math.max(0, interX2 - interX1);
      const ih = Math.max(0, interY2 - interY1);
      const inter = iw * ih;
      const union = a.w * a.h + b.w * b.h - inter;

      return union <= 0 ? 0 : inter / union;
    }

    function nmsPerClass(dets, iouThreshold = 0.45) {
      const byClass = new Map();
      for (const d of dets) {
        if (!byClass.has(d.classId)) byClass.set(d.classId, []);
        byClass.get(d.classId).push(d);
      }

      const out = [];
      for (const [, arr] of byClass) {
        arr.sort((a, b) => b.conf - a.conf);
        while (arr.length) {
          const best = arr.shift();
          out.push(best);
          for (let i = arr.length - 1; i >= 0; i--) {
            if (iou(best.bbox, arr[i].bbox) > iouThreshold) arr.splice(i, 1);
          }
        }
      }
      return out;
    }

    // -------- Model session (cached) --------
    let session = null;
    async function getSession() {
      if (session) return session;

      // Use WASM backend (default). You can configure threads if needed.
      // ort.env.wasm.numThreads = Math.min(4, navigator.hardwareConcurrency || 1);

      session = await ort.InferenceSession.create("../../lib/recognition/yolo/models/yolo11n.onnx", {
        executionProviders: ["wasm"]
      });
      return session;
    }

    // -------- Preprocess: image -> letterboxed 640x640 -> Float32 CHW tensor --------
    async function imageToYoloTensor(imgEl, inputSize = 640) {
      const origW = imgEl.naturalWidth;
      const origH = imgEl.naturalHeight;

      const r = Math.min(inputSize / origW, inputSize / origH);
      const newW = Math.round(origW * r);
      const newH = Math.round(origH * r);

      const padX = inputSize - newW;
      const padY = inputSize - newH;
      const padLeft = Math.floor(padX / 2);
      const padTop = Math.floor(padY / 2);

      const canvas = document.createElement("canvas");
      canvas.width = inputSize;
      canvas.height = inputSize;
      const ctx2d = canvas.getContext("2d", { willReadFrequently: true });

      // Fill padding with black
      ctx2d.fillStyle = "black";
      ctx2d.fillRect(0, 0, inputSize, inputSize);

      // Draw resized image centered
      ctx2d.drawImage(imgEl, 0, 0, origW, origH, padLeft, padTop, newW, newH);

      const imageData = ctx2d.getImageData(0, 0, inputSize, inputSize).data; // RGBA
      const area = inputSize * inputSize;
      const chw = new Float32Array(3 * area);

      for (let i = 0; i < area; i++) {
        const r8 = imageData[i * 4 + 0];
        const g8 = imageData[i * 4 + 1];
        const b8 = imageData[i * 4 + 2];

        chw[i] = r8 / 255.0;
        chw[i + area] = g8 / 255.0;
        chw[i + 2 * area] = b8 / 255.0;
      }

      return {
        tensor: new ort.Tensor("float32", chw, [1, 3, inputSize, inputSize]),
        origW, origH, r, padLeft, padTop, inputSize
      };
    }

    // -------- Postprocess: parse YOLOv11 raw output --------
    function parseYolov11RawOutput(outTensor, confThreshold = 0.5) {
      const data = outTensor.data;
      const dims = outTensor.dims; // likely [1,84,8400] or [1,8400,84]

      if (!Array.isArray(dims) || dims.length !== 3) {
        throw new Error(`Unexpected output dims: ${dims}`);
      }

      let numPred, numAttr, attrFirst;
      if (dims[1] === 84) {
        attrFirst = true;
        numAttr = dims[1];
        numPred = dims[2];
      } else if (dims[2] === 84) {
        attrFirst = false;
        numPred = dims[1];
        numAttr = dims[2];
      } else {
        throw new Error(`Unsupported output shape: ${dims.join("x")} (expected 84 in dim1 or dim2).`);
      }

      const dets = [];
      for (let i = 0; i < numPred; i++) {
        let cx, cy, w, h;
        if (attrFirst) {
          cx = data[0 * numPred + i];
          cy = data[1 * numPred + i];
          w  = data[2 * numPred + i];
          h  = data[3 * numPred + i];
        } else {
          const base = i * numAttr;
          cx = data[base + 0];
          cy = data[base + 1];
          w  = data[base + 2];
          h  = data[base + 3];
        }

        let bestClass = -1;
        let bestScore = -Infinity;
        for (let c = 0; c < 80; c++) {
          const score = attrFirst
            ? data[(4 + c) * numPred + i]
            : data[i * numAttr + (4 + c)];

          if (score > bestScore) {
            bestScore = score;
            bestClass = c;
          }
        }

        let conf = bestScore;
        if (conf < 0 || conf > 1) conf = sigmoid(conf);
        if (conf < confThreshold) continue;

        dets.push({
          classId: bestClass,
          conf,
          bbox: { x: cx - w / 2, y: cy - h / 2, w, h } // in 640x640 coords
        });
      }
      return dets;
    }

    function mapBoxToOriginal(bbox, ctx) {
      const x1 = (bbox.x - ctx.padLeft) / ctx.r;
      const y1 = (bbox.y - ctx.padTop) / ctx.r;
      const x2 = (bbox.x + bbox.w - ctx.padLeft) / ctx.r;
      const y2 = (bbox.y + bbox.h - ctx.padTop) / ctx.r;

      const ox1 = clamp(x1, 0, ctx.origW);
      const oy1 = clamp(y1, 0, ctx.origH);
      const ox2 = clamp(x2, 0, ctx.origW);
      const oy2 = clamp(y2, 0, ctx.origH);

      return { x: ox1, y: oy1, w: Math.max(0, ox2 - ox1), h: Math.max(0, oy2 - oy1) };
    }

    // -------- The function you asked for: recognize() --------
    async function recognize(imgEl) {
      const sess = await getSession();
      const inputName = sess.inputNames[0];
      const outputName = sess.outputNames[0];

      const prep = await imageToYoloTensor(imgEl, 640);
      const results = await sess.run({ [inputName]: prep.tensor });
      const outTensor = results[outputName];

      let dets = parseYolov11RawOutput(outTensor, 0.5);
      dets = nmsPerClass(dets, 0.45);

      const final = dets.map(d => {
        const b = mapBoxToOriginal(d.bbox, prep);
        const cls = COCO_CLASSES[d.classId] ?? `class_${d.classId}`;
        const accuracyRate = Math.round(d.conf * 10000) / 100; // percent, 2 decimals

        return {
          class: cls,
          coordinates: { x: Math.round(b.x), y: Math.round(b.y) },
          size: { width: Math.round(b.w), height: Math.round(b.h) },
          accuracyRate
        };
      });

      console.log(final);
      return final;
    }

    // -------- UI wiring --------
    const fileInput = document.getElementById("fileInput");
    const runBtn = document.getElementById("runBtn");
    const preview = document.getElementById("preview");

    let currentImageLoaded = false;

    fileInput.addEventListener("change", () => {
      const file = fileInput.files?.[0];
      if (!file) return;

      currentImageLoaded = false;
      runBtn.disabled = true;

      const url = URL.createObjectURL(file);
      preview.src = url;

      preview.onload = () => {
        currentImageLoaded = true;
        runBtn.disabled = false;
      };
    });

    runBtn.addEventListener("click", async () => {
      if (!currentImageLoaded) return;
      try {
        await recognize(preview);
      } catch (e) {
        console.error("recognize() failed:", e);
      }
    });

    // Expose recognize globally (optional)
    window.recognize = recognize;
  </script>
</body>
</html>
